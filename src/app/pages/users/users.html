<div class="flex items-center justify-center min-h-screen bg-gray-50">
  <div class="w-11/12 md:w-4/5 lg:w-3/4 xl:w-2/3">
    <!-- Tarjeta con tabla -->
    <div class="bg-white shadow-xl rounded-2xl p-6">
      <!-- Título -->
      <h1 class="text-3xl font-bold text-left text-gray-800 mb-6">👥 Users</h1>
      <p-table #dt [value]="allUsers" dataKey="id" [rows]="10" [rowsPerPageOptions]="[10, 25, 50]"
        [paginator]="true" selectionMode="multiple" [(selection)]="selectedUsers"
        [globalFilterFields]="['userName', 'email', 'country']" [tableStyle]="{ 'min-width': '75rem' }">
        <!-- Barra de búsqueda -->
        <ng-template #caption>
          <div class="flex items-center gap-4 w-full">
            <div class="flex gap-2">
              <p-button label="Add" icon="pi pi-plus" severity="success"
                [disabled]="selectedUsers && selectedUsers.length > 0" (onClick)="onAdd()" />

              <p-button label="Edit" icon="pi pi-pencil" severity="warn"
                [disabled]="!selectedUsers || selectedUsers.length !== 1" (onClick)="onEdit(selectedUsers[0])" />

              <p-button label="Delete" icon="pi pi-trash" severity="danger"
                [disabled]="!selectedUsers || selectedUsers.length === 0" (onClick)="onDelete(selectedUsers)" />
            </div>

            <!-- Buscador -->
            <p-iconfield iconPosition="left" class="ml-auto w-96">
              <p-inputicon>
                <i class="pi pi-search text-xl"></i>
              </p-inputicon>
              <input pInputText type="text" class="p-inputtext-lg w-full"
                (input)="dt.filterGlobal($event.target.value, 'contains')"
                placeholder="Search name, country or email" />
            </p-iconfield>
          </div>
        </ng-template>

        <!-- Encabezado -->
        <ng-template #header>
          <tr>
            <th scope="col" style="width: 3rem">
              <p-tableHeaderCheckbox></p-tableHeaderCheckbox>
            </th>
            <th scope="col">User</th>
            <th scope="col">Email</th>
            <th scope="col" pSortableColumn="gender">
              Gender <p-sortIcon field="gender"></p-sortIcon>
            </th>
            <th scope="col">Cellphone</th>
            <th scope="col" pSortableColumn="birthDate">
              Birth Date <p-sortIcon field="birthDate"></p-sortIcon>
            </th>
            <th scope="col">Country</th>
            <th scope="col" pSortableColumn="isActive">
              Status <p-sortIcon field="isActive"></p-sortIcon>
            </th>
          </tr>
        </ng-template>

        <!-- Cuerpo -->
        <ng-template #body let-user>
          <tr [pSelectableRow]="user">
            <td>
              <p-tableCheckbox [value]="user"></p-tableCheckbox>
            </td>
            <td>
              <div class="flex items-center gap-2">
                <p-avatar label="{{ user.userName[0] | uppercase }}" shape="circle"></p-avatar>
                <span class="font-semibold">{{ user.userName }}</span>
              </div>
            </td>
            <td>{{ user.email }}</td>
            <td>{{ user.gender }}</td>
            <td>{{ user.cellphone || 'Not Provided' }}</td>
            <td>{{ user.birthDate || 'Not Provided' }}</td>
            <td>{{ user.country }}</td>
            <td>
              <p-tag [value]="user.isActive ? 'Active' : 'Inactive'"
                [severity]="user.isActive ? 'success' : 'danger'" />
            </td>
          </tr>
        </ng-template>

        <!-- Mensaje vacío -->
        <ng-template #emptymessage>
          <tr>
            <td colspan="8">No users found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  </div>
</div>
